<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="robots" content="{{ page.robots }}">
<link rel="canonical" href="{{ page.canonical }}">
<meta name="theme-color" content="#2F3E36">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Cozy Home by Fany">
<meta property="og:title" content="{{ page.title }}">

<meta property="og:url" content="{{ page.canonical }}">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preload" href="/fonts/cormorant-garamond-normal-latin-2fed1d.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jost-normal-latin-35841f.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/main.css">
<script type="application/ld+json">{{{ page.jsonld }}}</script>
